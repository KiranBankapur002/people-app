<div class="card">
  <div class="breadcrumb">
    <a routerLink="/people">← Back to List</a>
  </div>

  <div *ngIf="loading" class="alert alert-info">
    Loading person details...
  </div>

  <div *ngIf="!loading && errorMessage" class="alert alert-danger">
    {{ errorMessage }}
  </div>

  <div *ngIf="!loading && person">
    <h2>{{ person.firstName }} {{ person.lastName }}</h2>
    
    <div style="margin-top: 2rem;">
      <div class="form-group">
        <label>Email</label>
        <p style="padding: 0.75rem; background-color: #f8f9fa; border-radius: 4px;">
          {{ person.email }}
        </p>
      </div>

      <div class="form-group">
        <label>Phone</label>
        <p style="padding: 0.75rem; background-color: #f8f9fa; border-radius: 4px;">
          {{ person.phone || 'Not provided' }}
        </p>
      </div>

      <div class="form-group">
        <label>Address</label>
        <p style="padding: 0.75rem; background-color: #f8f9fa; border-radius: 4px;">
          {{ person.address || 'Not provided' }}
        </p>
      </div>
    </div>

    <div style="display: flex; gap: 1rem; margin-top: 2rem;">
      <a [routerLink]="['/people/edit', person.id]" class="btn btn-primary">Edit Person</a>
      <button (click)="deletePerson()" class="btn btn-danger">Delete Person</button>
      <a routerLink="/people" class="btn btn-secondary">Back to List</a>
    </div>
  </div>
</div>
